name: Publish to Modrinth & CurseForge

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches to publish ("all" or comma-separated e.g. "1.21.1,1.21.11")'
        required: true
        default: 'all'
        type: string
      version_type:
        description: 'Release channel'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      target:
        description: 'Platforms to upload to'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - modrinth
          - curseforge
      changelog:
        description: 'Release changelog'
        required: true
        default: 'Bug fixes and improvements.'
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Discover target branches & Java versions
        id: build-matrix
        env:
          FILTER: ${{ inputs.branches }}
        run: |
          git fetch origin '+refs/heads/neoforge/*:refs/remotes/origin/neoforge/*'
          MATRIX=$(python3 -c '
          import json, os, re, subprocess

          filt = os.environ["FILTER"].strip()
          wanted = [x.strip() for x in filt.split(",") if x.strip()] if filt and filt.lower() != "all" else None

          out = subprocess.check_output(
              ["git", "for-each-ref", "--format=%(refname:short)", "refs/remotes/origin/neoforge/"],
              text=True,
          )
          entries = []
          for ref in sorted(out.splitlines()):
              branch = ref.removeprefix("origin/")
              ver = branch.removeprefix("neoforge/")
              if wanted is not None and branch not in wanted and ver not in wanted:
                  continue
              bg = subprocess.check_output(["git", "show", f"{ref}:build.gradle"], text=True)
              m = re.search(r"JavaLanguageVersion\.of\((\d+)\)", bg)
              java = m.group(1) if m else "21"
              entries.append({"branch": branch, "java": java})

          if not entries:
              raise SystemExit(f"No matching neoforge/* branches found for filter: {filt!r}")

          print(json.dumps({"include": entries}))
          ')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read metadata & strip Windows java.home
        id: meta
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          MOD_VER=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          MC_VER=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "mod_version=$MOD_VER" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VER" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ (inputs.target == 'both' || inputs.target == 'modrinth') && 'origins-legacy-neoforged' || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ (inputs.target == 'both' || inputs.target == 'curseforge') && '1606635' || '' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: 'build/libs/!(*-@(dev|sources|javadoc)).jar'
          name: "Origins Legacy ${{ steps.meta.outputs.mod_version }} (NeoForge ${{ steps.meta.outputs.mc_version }})"
          version: "${{ steps.meta.outputs.mod_version }}+mc${{ steps.meta.outputs.mc_version }}"
          version-type: ${{ inputs.version_type }}
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.mc_version }}
          changelog: ${{ inputs.changelog }}
          fail-mode: fail
